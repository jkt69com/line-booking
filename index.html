<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>きよの姫予約</title>

  <script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>
  <main class="app">

    <!-- ホーム画面 -->
    <section id="homeScreen" class="screen is-active">
      <h1 class="title">きよの姫予約</h1>

      <p class="description">
        ご希望のコースと日時を選んでください。
      </p>

      <div id="lineUserStatus" class="user-status">
        <p class="loading-message">
          LINEユーザー情報を確認しています…
        </p>
      </div>

      <button
        id="startBookingButton"
        type="button"
        class="button"
        onclick="showScreen('menuScreen')"
        disabled
      >
        予約する
      </button>
    </section>

    <!-- コース選択画面 -->
    <section id="menuScreen" class="screen">
      <h1 class="title">コース選択</h1>

      <p class="description">
        ご希望のコースを選択してください。
      </p>

      <div class="selection-list">
        <button
          type="button"
          class="selection-item"
          onclick="selectMenu('60分コース')"
        >
          60分コース
        </button>

        <button
          type="button"
          class="selection-item"
          onclick="selectMenu('90分コース')"
        >
          90分コース
        </button>

        <button
          type="button"
          class="selection-item"
          onclick="selectMenu('120分コース')"
        >
          120分コース
        </button>
      </div>

      <button
        type="button"
        class="back-button"
        onclick="showScreen('homeScreen')"
      >
        ← 戻る
      </button>
    </section>

    <!-- 日付選択画面 -->
    <section id="dateScreen" class="screen">
      <h1 class="title">日付選択</h1>

      <p class="description">
        選択中：
        <strong id="selectedMenu"></strong>
      </p>

      <div id="dateList" class="selection-list"></div>

      <button
        type="button"
        class="back-button"
        onclick="showScreen('menuScreen')"
      >
        ← コース選択へ戻る
      </button>
    </section>

    <!-- 時間選択画面 -->
    <section id="timeScreen" class="screen">
      <h1 class="title">時間選択</h1>

      <p class="description">
        <span id="selectedDate"></span>
      </p>

      <div id="timeList" class="selection-list"></div>

      <button
        type="button"
        class="back-button"
        onclick="showScreen('dateScreen')"
      >
        ← 日付選択へ戻る
      </button>
    </section>

<section
  id="customerScreen"
  class="screen"
>
  <div class="screen-header">
    <button
      type="button"
      class="back-button"
      onclick="showScreen('timeScreen')"
    >
      戻る
    </button>

    <h2>お客様情報</h2>
  </div>

  <div class="selected-summary">
    <p>
      コース：
      <strong id="customerMenu"></strong>
    </p>

    <p>
      日付：
      <strong id="customerDate"></strong>
    </p>

    <p>
      時間：
      <strong id="customerTime"></strong>
    </p>
  </div>

  <div class="form-group">
    <label for="customerName">
      お名前(偽名可)
      <span class="required-label">必須</span>
    </label>

    <input
      type="text"
      id="customerName"
      class="form-input"
      maxlength="50"
      autocomplete="name"
      placeholder="例：ナカガワ ペット"
    >
  </div>

  <div class="form-group">
    <label for="customerPhone">
      電話番号
      <span class="required-label">必須</span>
    </label>

    <input
      type="tel"
      id="customerPhone"
      class="form-input"
      maxlength="20"
      autocomplete="tel"
      inputmode="tel"
      placeholder="例：09012345678"
    >
  </div>

  <p
    id="customerInputError"
    class="error-message"
    hidden
  ></p>

  <button
    type="button"
    class="button"
    onclick="proceedToConfirmation()"
  >
    入力内容を確認する
  </button>
</section>
    
    <!-- 確認画面 -->
    <section id="confirmScreen" class="screen">
      <h1 class="title">予約内容の確認</h1>

      <div class="summary">
        <div class="summary-row">
          <span>コース</span>
          <strong id="confirmMenu"></strong>
        </div>

        <div class="summary-row">
          <span>日付</span>
          <strong id="confirmDate"></strong>
        </div>

        <div class="summary-row">
          <span>時間</span>
          <strong id="confirmTime"></strong>
        </div>
      </div>

      <button
        id="submitButton"
        type="button"
        class="button"
        onclick="submitBooking()"
      >
        この内容で予約する
      </button>

      <button
        type="button"
        class="back-button"
        onclick="showScreen('timeScreen')"
      >
        ← 時間選択へ戻る
      </button>
    </section>

    <!-- 予約完了画面 -->
    <section id="completeScreen" class="screen">
      <h1 class="title">予約完了</h1>

      <p class="description">
        ご予約を受け付けました。
      </p>

      <div class="summary">
        <div class="summary-row">
          <span>コース</span>
          <strong id="completeMenu"></strong>
        </div>

        <div class="summary-row">
          <span>日付</span>
          <strong id="completeDate"></strong>
        </div>

        <div class="summary-row">
          <span>時間</span>
          <strong id="completeTime"></strong>
        </div>
      </div>

      <button
        type="button"
        class="button"
        onclick="resetBooking()"
      >
        最初の画面へ戻る
      </button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
